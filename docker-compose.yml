# Full development environment: `docker compose up --build`.
# Every variable has a default; to override them copy .env.example to .env.
name: cooperar

services:
  db:
    # Keep in sync with TestcontainersConfiguration so tests run on the same database as compose.
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cooperar}
      POSTGRES_USER: ${POSTGRES_USER:-cooperar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cooperar}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - '${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: cooperar-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-cooperar}
      DB_USER: ${POSTGRES_USER:-cooperar}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cooperar}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cooperar.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dev-admin-password}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Observatorio}
      # Development emails go to Mailpit instead of real inboxes.
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5173}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-nominatim}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      GEOGRAPHY_PROVIDER: ${GEOGRAPHY_PROVIDER:-georef}
      GEOREF_URL: ${GEOREF_URL:-https://apis.datos.gob.ar/georef/api}
      IMAGE_STORAGE: ${IMAGE_STORAGE:-disk}
      IMAGE_CLOUD_NAME: ${IMAGE_CLOUD_NAME:-}
      IMAGE_CLOUD_API_KEY: ${IMAGE_CLOUD_API_KEY:-}
      IMAGE_CLOUD_API_SECRET: ${IMAGE_CLOUD_API_SECRET:-}
    volumes:
      - image-data:/data/images
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Catches every email the backend sends; read them at http://localhost:8025. Development only.
  # With a real SMTP server as relay (MAILPIT_RELAY_* in .env), the "Release" button of a message sends it to a real
  # inbox, for example to try answering it. Nothing leaves unless released by hand.
  mailpit:
    image: axllent/mailpit:v1.31
    environment:
      MP_SMTP_RELAY_HOST: ${MAILPIT_RELAY_HOST:-}
      MP_SMTP_RELAY_PORT: ${MAILPIT_RELAY_PORT:-587}
      MP_SMTP_RELAY_STARTTLS: ${MAILPIT_RELAY_STARTTLS:-true}
      MP_SMTP_RELAY_AUTH: ${MAILPIT_RELAY_AUTH:-plain}
      MP_SMTP_RELAY_USERNAME: ${MAILPIT_RELAY_USERNAME:-}
      MP_SMTP_RELAY_PASSWORD: ${MAILPIT_RELAY_PASSWORD:-}
      # Relays only accept senders they verified, and the backend's local one is not.
      MP_SMTP_RELAY_OVERRIDE_FROM: ${MAILPIT_RELAY_FROM:-}
    ports:
      - '${MAILPIT_PORT:-8025}:8025'

  frontend:
    build: ./frontend
    image: cooperar-frontend
    ports:
      - '${FRONTEND_PORT:-5173}:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
  image-data:
