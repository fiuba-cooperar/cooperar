spring:
  application:
    name: cooperar
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cooperar}
    username: ${DB_USER:cooperar}
    password: ${DB_PASSWORD:cooperar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful
  forward-headers-strategy: framework

cooperar:
  security:
    jwt:
      secret: ${JWT_SECRET}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true
