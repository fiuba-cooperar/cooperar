# Emails are recorded by RecordingEmailSender, so the SMTP server is never contacted.
spring:
  mail:
    host: localhost

cooperar:
  security:
    jwt:
      secret: test-only-secret-0123456789abcdef0123
  admin:
    email: admin@test.local
    password: test-admin-password
  notifications:
    public-url: http://localhost:5173
    from: CooperAR <no-reply@test.local>
  # Tests that need a point stub the Geocoder; nothing reaches Nominatim.
  images:
    disk:
      directory: build/test-images
  geocoding:
    provider: none
  # Nothing reaches GeoRef: the address fields get no suggestions.
  geography:
    provider: none

  # The tests register many accounts from the same address; the limit has its own test with a low value.
  registration:
    rate-limit:
      max-per-window: 100000
  # The tests sign in and search many times from the same address; the limits have their own test with low values.
  login:
    rate-limit:
      max-per-address: 100000
      max-per-email: 100000
  search:
    rate-limit:
      max-per-window: 100000
